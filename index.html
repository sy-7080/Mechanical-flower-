<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
  :root { --ink:#e9e2d0; --accent:#d8a33f; }
  * { box-sizing: border-box; }
  html, body {
    margin:0; height:100%; overflow:hidden; background:#07090d; color:var(--ink);
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
  }
  #app { position:fixed; inset:0; }
  canvas { display:block; }

  #hud { position:fixed; top:26px; left:28px; pointer-events:none; user-select:none; }
  #hud h1 { margin:0; font-size:15px; letter-spacing:.42em; font-weight:500; color:#f2ead7; }
  #hud .cn { margin:7px 0 0; font-size:13px; letter-spacing:.62em; color:var(--accent); opacity:.9; }
  #hud .sub {
    margin:11px 0 0; font-size:10.5px; line-height:1.75; letter-spacing:.14em;
    color:#8b8f98; text-transform:uppercase;
  }

  #controls {
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
    display:flex; gap:10px; z-index:10;
  }
  button {
    appearance:none; cursor:pointer;
    background:rgba(20,24,31,.72);
    border:1px solid rgba(216,163,63,.35);
    color:#e9e2d0; padding:10px 18px; border-radius:999px;
    font:inherit; font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    backdrop-filter: blur(8px);
    transition: border-color .25s, background .25s, box-shadow .25s, color .25s;

  }
  button.on { border-color:rgba(216,163,63,.95); color:#ffe9b8; }

  #hint {
    position:fixed; bottom:28px; right:28px; font-size:10px; letter-spacing:.16em;
    color:#5b6068; text-transform:uppercase; user-select:none; pointer-events:none;
  }

  #loader {
    position:fixed; inset:0; display:grid; place-items:center; background:#07090d;

  }
  #loader.hide { opacity:0; pointer-events:none; }

  @media (max-width:640px) {
    #hud .sub { display:none; }

</style>

<body>

<div id="app"></div>
<div id="loader">assembling gears…</div>

<div id="hud">
  <h1>MECHANICAL JASMINE</h1>
  <p class="cn">茉莉花</p>
  <p class="sub">
    8 articulated petals · 40 brass ribs · 104 rivets<br>
    helical torsion springs · planetary gear train · glowing anthers
  </p>
</div>

<div id="controls">
  <button id="btnMusic">♪ Music Off</button>
  <button id="btnSpin" class="on">⟳ Spin On</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
/* =====================================================================
   MECHANICAL JASMINE
   A procedurally generated, fully articulated brass jasmine bloom.
   ---------------------------------------------------------------------
   Sections:
     1. Renderer / scene / camera
     2. Lighting + image-based environment
     3. Materials
     4. Geometry helpers (gears, petals, hinges)
     5. Assembly (core, petals, stamens, calyx, stem, base)
     6. Animation loop
     7. Procedural music box (Web Audio API)
     8. UI wiring
   ===================================================================== */

import * as THREE from 'three';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* =====================================================================
   1. RENDERER / SCENE / CAMERA
   ===================================================================== */

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07090d);
scene.fog = new THREE.FogExp2(0x07090d, 0.032);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 120);
camera.position.set(3.6, 3.9, 7.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.35, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.enablePan = false;
controls.minDistance = 3.2;
controls.maxDistance = 17;
controls.minPolarAngle = 0.25;
controls.maxPolarAngle = Math.PI * 0.53;

/* =====================================================================
   2. LIGHTING + ENVIRONMENT
   ===================================================================== */

const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
const envRT = pmrem.fromScene(new RoomEnvironment(), 0.04);
scene.environment = envRT.texture;
pmrem.dispose();

// Key light — warm, casts the shadow
const keyLight = new THREE.DirectionalLight(0xfff1dc, 2.6);
keyLight.position.set(6, 11, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 34;
keyLight.shadow.camera.left = -7;
keyLight.shadow.camera.right = 7;
keyLight.shadow.camera.top = 7;
keyLight.shadow.camera.bottom = -7;
keyLight.shadow.bias = -0.0006;
keyLight.shadow.normalBias = 0.02;
scene.add(keyLight);

// Cool fill from behind-left
const fillLight = new THREE.DirectionalLight(0x7fa4ff, 1.1);
fillLight.position.set(-8, 4, -6);
scene.add(fillLight);

// Warm rim from behind
const rimLight = new THREE.PointLight(0xff9a4d, 45, 26, 2);
rimLight.position.set(-1.5, 3.2, -5.5);
scene.add(rimLight);

// Ambient bounce
scene.add(new THREE.HemisphereLight(0x7b8cff, 0x1a0f04, 0.55));

/* =====================================================================
   3. MATERIALS  (PBR, physically motivated)
   ===================================================================== */

const MAT = {
  brass: new THREE.MeshStandardMaterial({
    color: 0xd8a33f, metalness: 1.0, roughness: 0.26, envMapIntensity: 1.35
  }),
  brassDark: new THREE.MeshStandardMaterial({
    color: 0x9a6f22, metalness: 1.0, roughness: 0.44, envMapIntensity: 1.1
  }),
  copper: new THREE.MeshStandardMaterial({
    color: 0xc06a3a, metalness: 1.0, roughness: 0.30, envMapIntensity: 1.2
  }),
  steel: new THREE.MeshStandardMaterial({
    color: 0xc9d3dc, metalness: 1.0, roughness: 0.15, envMapIntensity: 1.5
  }),
  iron: new THREE.MeshStandardMaterial({
    color: 0x2b3038, metalness: 0.92, roughness: 0.52, envMapIntensity: 0.9
  }),
  patina: new THREE.MeshStandardMaterial({
    color: 0x4f7a5a, metalness: 0.85, roughness: 0.48, envMapIntensity: 0.9
  }),
  // Glazed porcelain petal with clear-coat and a soft sheen
  porcelain: new THREE.MeshPhysicalMaterial({
    color: 0xfdfaf3, metalness: 0.04, roughness: 0.34,
    clearcoat: 1.0, clearcoatRoughness: 0.14,
    sheen: 1.0, sheenColor: 0xfff2cf, sheenRoughness: 0.6,
    envMapIntensity: 0.85
  }),
  // Emissive pollen
  glow: new THREE.MeshStandardMaterial({
    color: 0xffe6b0, emissive: 0xffcf80, emissiveIntensity: 2.0, roughness: 0.4
  })
};

/* =====================================================================
   4. GEOMETRY HELPERS
   ===================================================================== */

const clamp01 = v => Math.min(1, Math.max(0, v));

/**
 * Involute-approximate spur gear as an extruded Shape.
 */
function gearGeometry(radius, teeth, thickness, toothDepth, holeR) {
  const shape = new THREE.Shape();
  const step = (Math.PI * 2) / teeth;
  const rRoot = radius - toothDepth * 0.5;
  const rTip  = radius + toothDepth * 0.5;

  for (let i = 0; i < teeth; i++) {
    const a = i * step;
    const pts = [
      [rRoot, a],
      [rTip,  a + step * 0.22],
      [rTip,  a + step * 0.50],
      [rRoot, a + step * 0.72]
    ];
    pts.forEach(([r, ang], k) => {
      const x = Math.cos(ang) * r;
      const y = Math.sin(ang) * r;
      (i === 0 && k === 0) ? shape.moveTo(x, y) : shape.lineTo(x, y);
    });
  }
  shape.closePath();

  if (holeR > 0) {
    const hole = new THREE.Path();
    hole.absarc(0, 0, holeR, 0, Math.PI * 2, true);
    shape.holes.push(hole);
  }

  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: thickness,
    bevelEnabled: true,
    bevelThickness: 0.008,
    bevelSize: 0.008,
    bevelSegments: 1,
    curveSegments: 8
  });
  geo.translate(0, 0, -thickness / 2);
  return geo;
}

/* ---- Petal parametric surface --------------------------------------
   Built flat in XY (length along +X, width along ±Y, thickness +Z),
   then every vertex is pushed along Z by one analytic bend function so
   plate, ribs and rivets share exactly the same curvature.            */

const PETAL_L = 2.30;
const PETAL_W = 1.12;

function halfWidth(t) {
  return 0.60 * PETAL_W * Math.sin(Math.PI * Math.pow(clamp01(t), 0.82));
}

function bendZ(t, u) {
  const camber = 0.80 * t * t;
  const cup    = 0.30 * u * u * Math.min(1, t * 1.5);
  return camber + cup;
}

function surfacePoint(t, u) {
  const hw = halfWidth(t);
  return new THREE.Vector3(t * PETAL_L, u * hw, bendZ(t, u));
}

/* ---------------------------------------------------------------------
   One complete petal: porcelain plate + 5 brass ribs + 13 rivets.
   --------------------------------------------------------------------- */
function buildPetal() {
  const group = new THREE.Group();

  /* --- 4.1 the porcelain plate ------------------------------------- */
  const shape = new THREE.Shape();
  shape.moveTo(0, 0);
  shape.bezierCurveTo(PETAL_L * 0.20,  PETAL_W * 0.60,
                      PETAL_L * 0.68,  PETAL_W * 0.54,  PETAL_L, 0);
  shape.bezierCurveTo(PETAL_L * 0.68, -PETAL_W * 0.54,
                      PETAL_L * 0.20, -PETAL_W * 0.60,  0, 0);

  const plateGeo = new THREE.ExtrudeGeometry(shape, {
    depth: 0.045,
    bevelEnabled: true,
    bevelThickness: 0.018,
    bevelSize: 0.018,
    bevelSegments: 2,
    curveSegments: 16,
    steps: 1
  });

  const pos = plateGeo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const t = clamp01(v.x / PETAL_L);
    const hw = halfWidth(t);
    const u = hw > 1e-4 ? THREE.MathUtils.clamp(v.y / hw, -1.25, 1.25) : 0;
    pos.setZ(i, v.z + bendZ(t, u));
  }
  plateGeo.computeVertexNormals();

  const plate = new THREE.Mesh(plateGeo, MAT.porcelain);
  plate.castShadow = true;
  plate.receiveShadow = true;
  group.add(plate);

  /* --- 4.2 brass ribs following the same curve ---------------------- */
  const RIB_U = [-0.80, -0.42, 0.0, 0.42, 0.80];
  const RIB_R = [0.019, 0.019, 0.030, 0.019, 0.019];
  const RIB_Z = 0.055;

  RIB_U.forEach((u, idx) => {
    const pts = [];
    const N = 26;
    for (let i = 0; i <= N; i++) {
      const t = 0.015 + 0.972 * (i / N);
      const p = surfacePoint(t, u);
      p.z += RIB_Z;
      pts.push(p);
    }
    const curve = new THREE.CatmullRomCurve3(pts);
    const tube = new THREE.TubeGeometry(curve, 44, RIB_R[idx], 7, false);
    const rib = new THREE.Mesh(tube, idx === 2 ? MAT.brassDark : MAT.brass);
    rib.castShadow = true;
    group.add(rib);
  });

  /* --- 4.3 rivets riding on the ribs -------------------------------- */
  const rivetGeo = new THREE.SphereGeometry(0.033, 10, 8);
  const addRivet = (t, u) => {
    const p = surfacePoint(t, u);
    p.z += RIB_Z + 0.028;
    const m = new THREE.Mesh(rivetGeo, MAT.steel);
    m.position.copy(p);
    m.castShadow = true;
    group.add(m);
  };

  [0.20, 0.35, 0.50, 0.65, 0.80].forEach(t => { addRivet(t, -0.80); addRivet(t, 0.80); });
  [0.15, 0.32, 0.49].forEach(t => addRivet(t, 0.0));

  return group;
}

/* ---------------------------------------------------------------------
   Hinge hardware: axle, collars, helical torsion spring, mounting arm.
   --------------------------------------------------------------------- */
function buildHinge() {
  const g = new THREE.Group();

  const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.038, 0.62, 14), MAT.steel);
  axle.rotation.x = Math.PI / 2;
  axle.castShadow = true;
  g.add(axle);

  [-0.28, 0.28].forEach(z => {
    const c = new THREE.Mesh(new THREE.CylinderGeometry(0.062, 0.062, 0.055, 14), MAT.brass);
    c.rotation.x = Math.PI / 2;
    c.position.z = z;
    c.castShadow = true;
    g.add(c);
  });

  const coil = [];
  const turns = 4.5, N = 90;
  for (let i = 0; i <= N; i++) {
    const p = i / N;
    const a = p * Math.PI * 2 * turns;
    coil.push(new THREE.Vector3(Math.cos(a) * 0.085, Math.sin(a) * 0.085, -0.16 + p * 0.32));
  }
  const spring = new THREE.Mesh(
    new THREE.TubeGeometry(new THREE.CatmullRomCurve3(coil), 150, 0.014, 6, false),
    MAT.steel
  );
  spring.castShadow = true;
  g.add(spring);

  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.12, 0.12), MAT.iron);
  arm.position.set(-0.16, -0.02, 0);
  arm.castShadow = true;
  g.add(arm);

  return g;
}

/* =====================================================================
   5. ASSEMBLY
   ===================================================================== */

const flower = new THREE.Group();
flower.position.set(0, 2.45, 0);
scene.add(flower);

/* ---------- 5.1 turned-brass core (lathe profile) ------------------- */
{
  const profile = [
    [0.00, -0.62], [0.26, -0.62], [0.34, -0.54], [0.34, -0.40],
    [0.28, -0.32], [0.30, -0.20], [0.36, -0.08], [0.36,  0.06],
    [0.31,  0.18], [0.27,  0.30], [0.27,  0.46], [0.21,  0.60],
    [0.12,  0.70], [0.00,  0.74]
  ].map(([x, y]) => new THREE.Vector2(x, y));

  const core = new THREE.Mesh(new THREE.LatheGeometry(profile, 64), MAT.brass);
  core.castShadow = true;
  core.receiveShadow = true;
  flower.add(core);

  [-0.46, -0.14, 0.24].forEach(y => {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.355, 0.012, 8, 64), MAT.brassDark);
    ring.rotation.x = Math.PI / 2;
    ring.position.y = y;
    flower.add(ring);
  });

  const boltGeo = new THREE.CylinderGeometry(0.042, 0.042, 0.05, 6);
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    const bolt = new THREE.Mesh(boltGeo, MAT.steel);
    bolt.position.set(Math.cos(a) * 0.345, -0.30, Math.sin(a) * 0.345);
    bolt.rotation.z = Math.PI / 2;
    bolt.rotation.y = -a;
    bolt.castShadow = true;
    flower.add(bolt);
  }
}

/* ---------- 5.2 stamens / pistil ----------------------------------- */
{
  const stamens = new THREE.Group();

  const N = 9;
  for (let i = 0; i < N; i++) {
    const a    = (i / N) * Math.PI * 2 + 0.35;
    const lean = 0.26 + (i % 3) * 0.07;
    const h    = 0.52 + (i % 4) * 0.055;

    const pts = [
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(Math.cos(a) * lean * 0.30, h * 0.45, Math.sin(a) * lean * 0.30),
      new THREE.Vector3(Math.cos(a) * lean * 1.00, h * 1.00, Math.sin(a) * lean * 1.00),
      new THREE.Vector3(Math.cos(a) * lean * 1.35, h * 1.14, Math.sin(a) * lean * 1.35)
    ];
    const curve = new THREE.CatmullRomCurve3(pts);
    const rod = new THREE.Mesh(
      new THREE.TubeGeometry(curve, 22, 0.016, 6, false), MAT.copper
    );
    rod.castShadow = true;
    stamens.add(rod);

    const anther = new THREE.Mesh(new THREE.SphereGeometry(0.055, 10, 8), MAT.glow);
    anther.position.copy(pts[3]);
    stamens.add(anther);
  }

  const pistil = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.075, 0.80, 14), MAT.steel);
  pistil.position.y = 0.36;
  pistil.castShadow = true;
  stamens.add(pistil);

  const stigma = new THREE.Mesh(new THREE.SphereGeometry(0.078, 14, 10), MAT.brass);
  stigma.position.y = 0.78;
  stamens.add(stigma);

  stamens.position.y = 0.55;
  flower.add(stamens);
}

/* ---------- 5.3 the eight articulated petals ----------------------- */
const PETAL_COUNT = 8;
const HINGE_R = 0.37;
const HINGE_Y = 0.10;

const petals = [];

for (let i = 0; i < PETAL_COUNT; i++) {
  const pivot = new THREE.Group();
  pivot.rotation.y = (i / PETAL_COUNT) * Math.PI * 2;
  flower.add(pivot);

  const hinge = new THREE.Group();
  hinge.position.set(HINGE_R, HINGE_Y, 0);
  pivot.add(hinge);
  hinge.add(buildHinge());

  const hingeGear = new THREE.Mesh(gearGeometry(0.10, 10, 0.045, 0.022, 0.03), MAT.brass);
  hingeGear.position.z = 0.345;
  hingeGear.castShadow = true;
  hinge.add(hingeGear);

  const tilt = new THREE.Group();
  hinge.add(tilt);

  const petal = buildPetal();
  petal.rotation.x = -Math.PI / 2;
  tilt.add(petal);

  petals.push({ pivot, hinge, tilt, hingeGear, phase: i * 0.62 });
}

/* ---------- 5.4 calyx / sepals ------------------------------------- */
{
  const sepalShape = new THREE.Shape();
  sepalShape.moveTo(0, 0);
  sepalShape.quadraticCurveTo(0.28,  0.19, 0.82, 0);
  sepalShape.quadraticCurveTo(0.28, -0.19, 0, 0);

  const sepalGeo = new THREE.ExtrudeGeometry(sepalShape, {
    depth: 0.03, bevelEnabled: true, bevelThickness: 0.01,
    bevelSize: 0.01, bevelSegments: 1, curveSegments: 12
  });

  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2 + 0.4;
    const holder = new THREE.Group();
    holder.rotation.y = a;
    holder.position.y = -0.42;

    const sepal = new THREE.Mesh(sepalGeo, MAT.patina);
    sepal.position.x = 0.26;
    sepal.rotation.x = -Math.PI / 2;
    sepal.rotation.z = -0.85;
    sepal.castShadow = true;
    holder.add(sepal);

    flower.add(holder);
  }
}

/* ---------- 5.5 planetary gear train under the bloom --------------- */
const RING_R   = 0.56;
const RING_RATE = 0.42;
const gearRingPivot = new THREE.Group();
gearRingPivot.position.y = -0.34;
flower.add(gearRingPivot);

{
  const ringMesh = new THREE.Mesh(
    gearGeometry(RING_R, 40, 0.085, 0.055, RING_R * 0.34),
    MAT.brass
  );
  ringMesh.rotation.x = -Math.PI / 2;
  ringMesh.castShadow = true;
  ringMesh.receiveShadow = true;
  gearRingPivot.add(ringMesh);
}

const PLANET_R = 0.30;
const PLANET_ORBIT = 0.94;
const planets = [];
for (let i = 0; i < 3; i++) {
  const a = (i / 3) * Math.PI * 2;
  const holder = new THREE.Group();
  holder.position.set(Math.cos(a) * PLANET_ORBIT, 0, Math.sin(a) * PLANET_ORBIT);
  gearRingPivot.add(holder);

  const mesh = new THREE.Mesh(
    gearGeometry(PLANET_R, 16, 0.075, 0.048, PLANET_R * 0.30),
    MAT.copper
  );
  mesh.rotation.x = -Math.PI / 2;
  mesh.castShadow = true;
  holder.add(mesh);

  const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.20, 12), MAT.steel);
  pin.castShadow = true;
  holder.add(pin);

  planets.push(holder);
}

{
  const plate = new THREE.Mesh(new THREE.CylinderGeometry(1.22, 1.22, 0.05, 72), MAT.iron);
  plate.position.y = -0.44;
  plate.receiveShadow = true;
  plate.castShadow = true;
  flower.add(plate);

  const rim = new THREE.Mesh(new THREE.TorusGeometry(1.22, 0.035, 10, 96), MAT.brass);
  rim.rotation.x = Math.PI / 2;
  rim.position.y = -0.44;
  flower.add(rim);
}

/* ---------- 5.6 stem ------------------------------------------------ */
{
  const stemBottom = 0.34;
  const stemTop    = flower.position.y - 0.66;
  const H = stemTop - stemBottom;

  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.108, H, 24), MAT.brassDark);
  stem.position.y = stemBottom + H / 2;
  stem.castShadow = true;
  stem.receiveShadow = true;
  scene.add(stem);

  const rivetGeo = new THREE.SphereGeometry(0.028, 8, 6);
  for (let i = 1; i <= 4; i++) {
    const y = stemBottom + (H / 5) * i;
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.108, 0.026, 8, 28), MAT.brass);
    ring.rotation.x = Math.PI / 2;
    ring.position.y = y;
    ring.castShadow = true;
    scene.add(ring);

    for (let k = 0; k < 8; k++) {
      const a = (k / 8) * Math.PI * 2;
      const r = new THREE.Mesh(rivetGeo, MAT.steel);
      r.position.set(Math.cos(a) * 0.112, y, Math.sin(a) * 0.112);
      scene.add(r);
    }
  }
}

/* ---------- 5.7 base plinth ---------------------------------------- */
{
  const plinth = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.80, 0.26, 64), MAT.iron);
  plinth.position.y = 0.16;
  plinth.castShadow = true;
  plinth.receiveShadow = true;
  scene.add(plinth);

  const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.46, 0.10, 48), MAT.brass);
  collar.position.y = 0.34;
  collar.castShadow = true;
  scene.add(collar);

  const baseGear = new THREE.Mesh(gearGeometry(0.66, 48, 0.06, 0.05, 0.60), MAT.brassDark);
  baseGear.rotation.x = -Math.PI / 2;
  baseGear.position.y = 0.30;
  scene.add(baseGear);
  scene.userData.baseGear = baseGear;

  const boltGeo = new THREE.CylinderGeometry(0.045, 0.045, 0.05, 6);
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2;
    const b = new THREE.Mesh(boltGeo, MAT.steel);
    b.position.set(Math.cos(a) * 0.70, 0.30, Math.sin(a) * 0.70);
    scene.add(b);
  }
}

{

  );

/* =====================================================================
   6. ANIMATION LOOP
   ===================================================================== */

const clock = new THREE.Clock();
const state = { spin: true, t: 0 };

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  const t  = clock.elapsedTime;
  state.t = t;

  /* --- whole bloom rotates --- */
  if (state.spin) flower.rotation.y += dt * 0.30;

  /* --- petal breathing: open / close / flutter --- */
  for (let i = 0; i < petals.length; i++) {
    const p = petals[i];
    const open = 0.5 + 0.5 * Math.sin(t * 0.55 - i * 0.30);
    const tiltAngle = 0.07 + open * 0.42;

    p.tilt.rotation.z = tiltAngle;
    p.tilt.rotation.y = Math.sin(t * 0.85 + p.phase) * 0.035;

    p.hingeGear.rotation.z = -tiltAngle * 2.4;
  }

  /* --- gear train --- */
  gearRingPivot.rotation.y += dt * RING_RATE;
  const planetRate = -RING_RATE * (RING_R / PLANET_R);
  for (const pl of planets) pl.rotation.y += dt * planetRate;

  if (scene.userData.baseGear) scene.userData.baseGear.rotation.z += dt * 0.18;

  /* --- glowing anthers pulse --- */
  MAT.glow.emissiveIntensity = 1.7 + Math.sin(t * 2.1) * 0.65;

  /* --- subtle idle motion of the whole mechanism --- */
  flower.position.y = 2.45 + Math.sin(t * 0.9) * 0.028;
  flower.rotation.z = Math.sin(t * 0.42) * 0.012;
  rimLight.intensity = 40 + Math.sin(t * 1.7) * 8;

  controls.update();
  renderer.render(scene, camera);
}

animate();

requestAnimationFrame(() => {
  const l = document.getElementById('loader');
  l.classList.add('hide');
  setTimeout(() => l.remove(), 1200);
});

/* =====================================================================
   7. PROCEDURAL MUSIC BOX  (Web Audio API)
   ---------------------------------------------------------------------
   A D-major pentatonic motif — a nod to the Jiangnan folk song
   《茉莉花》 — played on a struck "music-box" voice with a generated
   plate-reverb, over a slow sub pad. Fully synthesised, no assets.
   ===================================================================== */

class JasmineMusicBox {
  constructor() {
    this.ctx = null;
    this.playing = false;
    this.step = 0;
    this.nextTime = 0;
    this.timer = null;
    this.bpm = 74;

    this.scale = [
      293.66, 329.63, 369.99, 440.00, 493.88,   // D4 E4 F#4 A4 B4
      587.33, 659.25, 739.99, 880.00, 987.77    // D5 E5 F#5 A5 B5
    ];

    this.phrase = [
      [5,1],[6,1],[7,1],[6,1],[5,2],[3,2],
      [4,1],[5,1],[6,1],[5,1],[4,2],[2,2],
      [3,1],[4,1],[5,1],[6,1],[7,2],[5,2],
      [6,1],[5,1],[3,3],[null,1]
    ];
  }

  _impulse(seconds = 3.0, decay = 2.6) {
    const rate = this.ctx.sampleRate;
    const len = Math.floor(rate * seconds);
    const buf = this.ctx.createBuffer(2, len, rate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
    }
    return buf;
  }

  _build() {
    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = this.ctx = new AC();

    this.master = ctx.createGain();
    this.master.gain.value = 0;
    this.master.connect(ctx.destination);

    const conv = ctx.createConvolver();
    conv.buffer = this._impulse(3.2, 2.6);
    this.wet = ctx.createGain();
    this.wet.gain.value = 0.55;
    this.wet.connect(conv);
    conv.connect(this.master);

    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 7000;
    this.dry = ctx.createGain();
    this.dry.gain.value = 1.0;
    this.dry.connect(lp);
    lp.connect(this.master);
  }

  _bell(freq, time, dur, vol = 1) {
    const ctx = this.ctx;
    const g = ctx.createGain();
    const peak = 0.16 * vol;
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(peak, time + 0.010);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur * 2.2 + 0.9);
    g.connect(this.dry);
    g.connect(this.wet);

    const o1 = ctx.createOscillator(); o1.type = 'sine';     o1.frequency.value = freq;
    const o2 = ctx.createOscillator(); o2.type = 'sine';     o2.frequency.value = freq * 3.01;
    const o3 = ctx.createOscillator(); o3.type = 'triangle'; o3.frequency.value = freq * 2.00;

    const g2 = ctx.createGain(); g2.gain.value = 0.16;
    const g3 = ctx.createGain(); g3.gain.value = 0.09;

    o1.connect(g);
    o2.connect(g2); g2.connect(g);
    o3.connect(g3); g3.connect(g);

    const stop = time + dur * 2.2 + 1.0;
    [o1, o2, o3].forEach(o => { o.start(time); o.stop(stop); });
  }

  _pad(freq, time, dur) {
    const ctx = this.ctx;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, time);
    g.gain.linearRampToValueAtTime(0.055, time + 0.9);
    g.gain.linearRampToValueAtTime(0.0001, time + dur + 1.4);

    const f = ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.value = 820;

    const o1 = ctx.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = freq;
    const o2 = ctx.createOscillator(); o2.type = 'sawtooth'; o2.frequency.value = freq * 1.006;

    o1.connect(f); o2.connect(f);
    f.connect(g);
    g.connect(this.dry);
    g.connect(this.wet);

    const stop = time + dur + 1.6;
    [o1, o2].forEach(o => { o.start(time); o.stop(stop); });
  }

  _schedule() {
    const ctx = this.ctx;
    const beat = 60 / this.bpm;

    while (this.nextTime < ctx.currentTime + 0.28) {
      const [deg, beats] = this.phrase[this.step % this.phrase.length];
      const dur = beats * beat;

      if (deg !== null) {
        this._bell(this.scale[deg], this.nextTime, dur);
        if (this.step % 4 === 0) {
          this._bell(this.scale[deg] / 1.5, this.nextTime + 0.02, dur * 1.5, 0.35);
        }
      }

      if (this.step % 4 === 0) {
        this._pad(this.step % 8 === 0 ? 73.42 : 110.00, this.nextTime, beat * 4);
      }

      this.nextTime += dur;
      this.step++;
    }
  }

  async start() {
    if (!this.ctx) this._build();
    if (this.ctx.state === 'suspended') await this.ctx.resume();

    this.playing = true;
    this.nextTime = this.ctx.currentTime + 0.12;
    this.master.gain.cancelScheduledValues(this.ctx.currentTime);
    this.master.gain.setTargetAtTime(0.9, this.ctx.currentTime, 0.5);

    clearInterval(this.timer);
    this.timer = setInterval(() => this._schedule(), 30);
    this._schedule();
  }

  stop() {
    if (!this.ctx) return;
    this.playing = false;
    this.master.gain.cancelScheduledValues(this.ctx.currentTime);
    this.master.gain.setTargetAtTime(0.0, this.ctx.currentTime, 0.22);
    clearInterval(this.timer);
    this.timer = null;
  }

  toggle() {
    this.playing ? this.stop() : this.start();
    return this.playing;
  }
}

const music = new JasmineMusicBox();

/* =====================================================================
   8. UI WIRING
   ===================================================================== */

const btnMusic = document.getElementById('btnMusic');
const btnSpin  = document.getElementById('btnSpin');

btnMusic.addEventListener('click', async () => {
  let on;
  if (music.playing) {
    music.stop();
    on = false;
  } else {
    await music.start();
    on = true;
  }
  btnMusic.textContent = on ? '♪ Music On' : '♪ Music Off';
  btnMusic.classList.toggle('on', on);
});

btnSpin.addEventListener('click', () => {
  state.spin = !state.spin;
  btnSpin.textContent = state.spin ? '⟳ Spin On' : '⟳ Spin Off';
  btnSpin.classList.toggle('on', state.spin);
});

document.addEventListener('visibilitychange', () => {
  if (!music.ctx) return;
  if (document.hidden && music.playing) {
    music.ctx.suspend();
  } else if (!document.hidden && music.playing) {
    music.ctx.resume();
  }
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

/* Expose for console tinkering:  jasmine.petals[0].tilt.rotation.z = 0.6 */
window.jasmine = { scene, flower, petals, planets, gearRingPivot, music, MAT, camera, controls };
